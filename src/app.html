<!doctype html>
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Колір системного UI під тему сторінки -->
		<!-- Колір смуги браузера; при перемиканні теми його оновлює mode-watcher -->
		<meta name="theme-color" content="#ffffff" />

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" href="/icon-192x192.png" sizes="192x192" type="image/png" />
		<link rel="icon" href="/icon-512x512.png" sizes="512x512" type="image/png" />

		<!--
			На macOS/iOS підхоплюється системний SF Pro і Inter не завантажується.
			Для Windows/Android тягнемо Inter — найближчий за рисунком до SF.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
		/>

		<meta name="category" content="weather" />
		<meta
			name="robots"
			content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
